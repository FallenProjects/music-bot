[project]
name = "music-bot"
version = "1.2.5"
description = "Telegram Music Bot with full playback support using PyTdBot and PyTgCalls"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ashok Shau", email = "ashokshau@t.me" },
]
keywords = [
    "telegram",
    "music",
    "bot",
    "async",
    "tdlib",
    "pytgcalls",
    "voicechat",
    "spotify",
    "ytmusic",
    "opensource",
    "pytdbot",
    "py-tgcalls",
    "yt-dlp",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat :: Telegram",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Environment :: Console",
    "Framework :: AsyncIO",
]

dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.5",
    "cachetools>=7.2.4",
    "kurigram>=2.2.26",
    "ntgcalls==3.0.5",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "py-tgcalls==3.0.1b2",
    "py-yt-search==0.8.0",
    "pycryptodome>=4.1.0",
    "pydantic>=2.14.1",
    "pymongo>=4.19.0",
    "pytdbot>=0.10.1",
    "pytgcrypto>=1.2.12",
    "python-dotenv>=1.2.4",
    "tdjson==1.8.68",
    "ujson>=6.0.0",
    "yt-dlp>=2026.10.21.233146.dev0",
]

[project.license]
file = "LICENSE"

[project.optional-dependencies]
dev = [
    "black",
    "basedpyright>=1.40.2",
    "ruff>=0.17.2",
    "types-aiofiles>=25.1.0.20260518",
    "types-cachetools>=7.0.0.20260713",
]

[project.scripts]
start = "src.__main__:main"

[project.urls]
Homepage = "https://github.com/FallenProjects/music-bot"
Source = "https://github.com/FallenProjects/music-bot"
"Issue Tracker" = "https://github.com/FallenProjects/music-bot/issues"

[tool.uv]
package = true

[tool.setuptools]
packages = [
    "src",
]

[tool.basedpyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "ANN"]
ignore = ["ANN401"]
